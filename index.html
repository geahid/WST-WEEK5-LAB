<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 Hands-On</title>
</head>
<body>

    <h1>Week 5 Hands-On</h1>

    <!-- Task 1: Counter -->
    <section>
        <h2>Task 1 — Interactive Counter</h2>

        <p id="number">0</p>

        <button id="decrease" type="button">−</button>
        <button id="increase" type="button">+</button>
    </section>

    <!-- Task 2: To-Do List -->
    <section>
        <h2>Task 2 — Mini To-Do List</h2>

        <input
            type="text"
            id="todoInput"
            placeholder="Enter a task"
        >

        <button id="addTodo" type="button">Add</button>

        <ul id="todoList"></ul>
    </section>

    <!-- Task 3: Fetch Users -->
    <section>
        <h2>Task 3 — Users from API</h2>

        <p id="userMessage">Loading users...</p>

        <ul id="userList"></ul>
    </section>

    <script src="app.js"></script>
</body>
</html>
